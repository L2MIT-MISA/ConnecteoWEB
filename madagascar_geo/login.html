<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Moderne</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
        }
        .card-header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            text-align: center;
            padding: 2rem;
            border-bottom: none;
        }
        .card-body {
            padding: 2.5rem;
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 0.25rem rgba(106,17,203,0.25);
        }
        .btn-primary {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106,17,203,0.4);
        }
        .form-check-label {
            font-size: 0.9rem;
            color: #555;
        }
        .text-small {
            font-size: 0.85rem;
            color: #777;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #999;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eee;
        }
        .divider-text {
            padding: 0 1rem;
        }
        .social-btn {
            margin: 0.5rem;
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }
        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-facebook {
            background: #1877f2;
            color: white;
        }
        .btn-google {
            background: #ffffff;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-apple {
            background: #000000;
            color: white;
        }
        .eye-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            padding: 0.25rem;
        }
        .eye-icon:hover {
            color: #6a11cb;
        }
        .position-relative {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Créer un compte</h4>
            <p class="mb-0 small">Rejoignez notre communauté dès aujourd'hui</p>
        </div>
        <div class="card-body">
            <form>
                <div class="mb-3">
                    <label for="firstname" class="form-label">Prénom <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="firstname" placeholder="Entrez votre prénom" required>
                </div>
                <div class="mb-3">
                    <label for="lastname" class="form-label">Nom de famille <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="lastname" placeholder="Entrez votre nom" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="vous@exemple.com" required>
                </div>
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label">Mot de passe <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" minlength="8" required>
                    <span class="eye-icon" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="mb-3 position-relative">
                    <label for="confirmPassword" class="form-label">Confirmer le mot de passe <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" minlength="8" required>
                    <span class="eye-icon" id="toggleConfirmPassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="birthdate" class="form-label">Date de naissance</label>
                            <input type="date" class="form-control" id="birthdate">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="gender" class="form-label">Genre</label>
                            <select class="form-select" id="gender">
                                <option value="">Sélectionnez</option>
                                <option value="male">Homme</option>
                                <option value="female">Femme</option>
                                <option value="other">Autre</option>
                                <option value="prefer_not_say">Préfère ne pas répondre</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Téléphone</label>
                    <input type="tel" class="form-control" id="phone" placeholder="+33 6 12 34 56 78">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Adresse</label>
                    <textarea class="form-control" id="address" rows="2" placeholder="Entrez votre adresse"></textarea>
                </div>
                <div class="mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label" for="terms">
                            J'accepte les <a href="#" class="text-decoration-none">conditions d'utilisation</a> et la <a href="#" class="text-decoration-none">politique de confidentialité</a>
                        </label>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save me-2"></i>S'inscrire
                    </button>
                </div>
            </form>
        </div>
        <div class="card-footer text-center py-3">
            <p class="mb-0">Vous avez déjà un compte ? <a href="#" class="text-decoration-none fw-bold">Connectez-vous</a></p>
            <div class="mt-3">
                <p class="text-small mb-2">Ou continuer avec</p>
                <div>
                    <button type="button" class="btn social-btn btn-facebook">
                        <i class="fab fa-facebook-f"></i>Facebook
                    </button>
                    <button type="button" class="btn social-btn btn-google">
                        <i class="fab fa-google"></i>Google
                    </button>
                    <button type="button" class="btn social-btn btn-apple">
                        <i class="fab fa-apple"></i>Apple
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS (optional for toggle password) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('function', function () {
            const passwordField = document.getElementById('password');
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            // Toggle icon
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
            const passwordField = document.getElementById('confirmPassword');
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            // Toggle icon
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // Form submission simulation (prevent actual submit for demo)
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Formulaire soumis avec succès ! (En vraie application, cela enverrait les données au serveur)');
            // Reset form
            this.reset();
        });
    </script>
</body>
</html>
